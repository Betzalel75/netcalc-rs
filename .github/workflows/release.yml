name: Release Multi-plateforme

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── LINUX ──────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4

      - name: Installer la toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Dépendances (x86_64 natif)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libglib2.0-dev libx11-dev libxdo-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev

      - name: Dépendances (ARM64 cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          cargo install cross --git https://github.com/cross-rs/cross.git

      - name: Configurer Cross via Cross.toml et Dockerfile pour ARM64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          # 1. Générer un Dockerfile basé sur Ubuntu 22.04 incluant build-essential (pour le linker cc) et webkit2gtk
          cat << 'EOF' > Cross.Dockerfile
          FROM ubuntu:22.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config curl git ca-certificates
          RUN dpkg --add-architecture arm64 && \
              sed -i 's/deb http/deb [arch=amd64] http/g' /etc/apt/sources.list && \
              echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse" >> /etc/apt/sources.list && \
              echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse" >> /etc/apt/sources.list && \
              echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse" >> /etc/apt/sources.list && \
              apt-get update && \
              apt-get install -y --no-install-recommends \
                libglib2.0-dev:arm64 \
                libgtk-3-dev:arm64 \
                libx11-dev:arm64 \
                libxdo-dev:arm64 \
                libjavascriptcoregtk-4.1-dev:arm64 \
                libsoup-3.0-dev:arm64 \
                libwebkit2gtk-4.1-dev:arm64
          ENV CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
              AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar \
              CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc \
              CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++ \
              PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig/ \
              PKG_CONFIG_ALLOW_CROSS=1
          EOF

          # 2. Lier ce Dockerfile à la cible ARM64 dans Cross.toml
          cat << 'EOF' > Cross.toml
          [target.aarch64-unknown-linux-gnu]
          dockerfile = "Cross.Dockerfile"
          EOF

      - name: Compiler
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Empaqueter (.tar.xz)
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          mkdir -p app/debian
          cp target/${{ matrix.target }}/release/netcalc-rs app/
          cp -r assets app/
          cp debian/netcalc-rs.desktop app/debian/
          archive="netcalc-rs-${VERSION}-${{ matrix.target }}.tar.xz"
          tar -cJf $archive app/
          sha256sum $archive > ${archive}.sha256
          # Alias app.tar.xz pour le script d'install Linux
          cp $archive app.tar.xz
          cp ${archive}.sha256 app.tar.xz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: |
            netcalc-rs-*.tar.xz
            netcalc-rs-*.tar.xz.sha256
            app.tar.xz
            app.tar.xz.sha256

  # ── macOS ──────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Installer la toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Dépendances Homebrew
        run: |
          brew install gtk+3 pkg-config libsoup

      - name: Compiler
        run: cargo build --release --target ${{ matrix.target }}

      - name: Empaqueter (.tar.xz) — pas de debian/
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          mkdir -p app
          cp target/${{ matrix.target }}/release/netcalc-rs app/
          cp -r assets app/
          archive="netcalc-rs-${VERSION}-${{ matrix.target }}.tar.xz"
          tar -cJf $archive app/
          shasum -a 256 $archive > ${archive}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            netcalc-rs-*.tar.xz
            netcalc-rs-*.tar.xz.sha256

  # ── WINDOWS ────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: MSYS2 + dépendances
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-libsoup3
            zip

      - name: Compiler
        shell: msys2 {0}
        run: cargo build --release

      - name: Empaqueter (.zip) — exe autonome + assets
        shell: msys2 {0}
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          mkdir -p app
          cp target/release/netcalc-rs.exe app/
          cp -r assets app/
          cd app
          # Créer un script de lancement PowerShell
          echo '@echo off
          start "" "%~dp0netcalc-rs.exe"' > ../launch-netcalc.bat
          cd ..
          archive="netcalc-rs-${VERSION}-x86_64-windows.zip"
          zip -r $archive app/ launch-netcalc.bat
          # Alternative : exe seul pour ceux qui veulent du portable
          cp target/release/netcalc-rs.exe netcalc-rs-${VERSION}-x86_64-windows.exe
          certutil -hashfile netcalc-rs-${VERSION}-x86_64-windows.exe SHA256 > netcalc-rs-${VERSION}-x86_64-windows.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            netcalc-rs-*.zip
            netcalc-rs-*.zip.sha256
            netcalc-rs-*.exe
            netcalc-rs-*.exe.sha256

  # ── PUBLISH ─────────────────────────────────────────────────────────
  publish-release:
    name: Publier la GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolider les fichiers
        run: |
          mkdir -p release_files
          find artifacts/ -type f \( \
            -name "*.tar.xz" -o -name "*.zip" -o -name "*.exe" \
          \) -exec cp {} release_files/ \;
          # Checksums consolidés
          find artifacts/ -name "*.sha256" -exec cat {} \; > release_files/sha256sums.txt
          # Alias app.tar.xz pour le script d'install Linux
          first=$$(ls release_files/*linux*.tar.xz 2>/dev/null | head -1)
          [ -n "$$first" ] && cp "$$first" release_files/app.tar.xz
          echo "=== Fichiers publiés ==="
          ls -lh release_files/

      - uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          tag_name: ${{ github.ref_name }}
          name: Version ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}