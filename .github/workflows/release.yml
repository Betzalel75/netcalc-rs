name: Release Multi-plateforme

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer la toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Installer les dépendances GTK3/X11 (Cible x86_64 native)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libglib2.0-dev libx11-dev libxdo-dev

      - name: Installer QEMU et Cross (Cible ARM64 Cross-compilation)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          cargo install cross --git https://github.com/cross-rs/cross.git

      - name: Générer Cross.toml pour injecter les libs ARM64 dans le conteneur
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cat << 'EOF' > Cross.toml
          [target.aarch64-unknown-linux-gnu]
          pre-build = [
              "dpkg --add-architecture arm64 && apt-get update && apt-get install --no-install-recommends --assume-yes libglib2.0-dev:arm64 libgtk-3-dev:arm64 libx11-dev:arm64 libxdo-dev:arm64"
          ]
          EOF

      - name: Compiler le binaire
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Empaqueter l'artefact Linux (.tar.xz)
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          mkdir -p app/debian
          cp target/${{ matrix.target }}/release/netcalc-rs app/
          cp -r assets app/
          cp debian/netcalc-rs.desktop app/debian/
          archive="netcalc-rs-${VERSION}-${{ matrix.target }}.tar.xz"
          tar -cJf $archive app/
          sha256sum $archive > ${archive}.sha256

      - name: Téléverser l'artefact temporairement
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: |
            netcalc-rs-*.tar.xz
            netcalc-rs-*.tar.xz.sha256

  build-windows:
    name: Build Windows (x86_64-pc-windows-gnu)
    runs-on: windows-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer MSYS2, installer GCC, GTK3 et Rust (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-rust

      - name: Compiler le binaire sous l'environnement MSYS2
        shell: msys2 {0}
        run: |
          cargo build --release

      - name: Empaqueter l'artefact Windows (.zip)
        shell: msys2 {0}
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          mkdir -p app
          cp target/release/netcalc-rs.exe app/
          cp -r assets app/
          archive="netcalc-rs-${VERSION}-x86_64-pc-windows-gnu.zip"
          zip -r $archive app
          sha256sum $archive > ${archive}.sha256

      - name: Téléverser l'artefact temporairement
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            netcalc-rs-*.zip
            netcalc-rs-*.zip.sha256

  build-macos:
    name: Build macOS (x86_64-apple-darwin)
    runs-on: macos-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer la toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Installer GTK3 et Pkg-Config via Homebrew
        run: |
          brew install gtk+3 pkg-config

      - name: Compiler le binaire Mac
        run: cargo build --release --target x86_64-apple-darwin

      - name: Empaqueter l'artefact Mac (.tar.xz)
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          mkdir -p app
          cp target/x86_64-apple-darwin/release/netcalc-rs app/
          cp -r assets app/
          archive="netcalc-rs-${VERSION}-x86_64-apple-darwin.tar.xz"
          tar -cJf $archive app/
          shasum -a 256 $archive > ${archive}.sha256

      - name: Téléverser l'artefact temporairement
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: |
            netcalc-rs-*.tar.xz
            netcalc-rs-*.tar.xz.sha256

  publish-release:
    name: Publier la GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer tous les artefacts des jobs précédents
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolider les archives et générer le fichier sha256sums.txt
        run: |
          mkdir -p release_files
          find artifacts/ -type f \( -name "*.tar.xz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release_files/ \;
          cd release_files
          cat *.sha256 > sha256sums.txt
          rm -f *.sha256
          echo "==== Liste des fichiers à publier ===="
          ls -lh

      - name: Créer la release officielle sur GitHub et attacher les fichiers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_files/*
          tag_name: ${{ github.ref_name }}
          name: Version ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}