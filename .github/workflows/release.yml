# ── WINDOWS ────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Utilisation de la toolchain MSVC (Native Windows), plus besoin de MSYS2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Installer dioxus-cli
        run: |
            cargo install cargo-binstall
            cargo binstall dioxus-cli@0.7.9

      # On compile pour la cible MSVC native
      - name: Compiler (dx bundle)
        run: dx bundle --release --platform desktop --target x86_64-pc-windows-msvc

      # Utilisation de Git Bash (inclus dans le runner Windows) pour vos scripts
      - name: Empaqueter (.zip)
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          mkdir -p app
          
          # 1. Trouver automatiquement l'exécutable (.exe) en ignorant le dossier de dépendances (deps)
          EXE_PATH=$(find target -type f -name "netcalc-rs.exe" | grep "release" | grep -v "deps" | head -n 1)
          
          if [ -z "$EXE_PATH" ]; then
            echo "Erreur : netcalc-rs.exe est introuvable !"
            exit 1
          fi
          
          echo "Exécutable trouvé à : $EXE_PATH"
          cp "$EXE_PATH" app/
          
          # 2. Créer le script de lancement
          echo '@echo off
          start "" "%~dp0netcalc-rs.exe"' > launch-netcalc.bat
          
          # 3. Créer le fichier ZIP
          archive="netcalc-rs-${VERSION}-x86_64-windows.zip"
          zip -r $archive app/ launch-netcalc.bat
          
          # 4. Préparer l'exécutable seul pour l'artifact et générer son SHA256
          cp app/netcalc-rs.exe netcalc-rs-${VERSION}-x86_64-windows.exe
          sha256sum netcalc-rs-${VERSION}-x86_64-windows.exe > netcalc-rs-${VERSION}-x86_64-windows.exe.sha256
          
          # Bonus : Si dx bundle a généré un installeur MSI, on le récupère aussi !
          MSI_PATH=$(find target/dx -type f -name "*.msi" | head -n 1)
          if [ -n "$MSI_PATH" ]; then
            echo "Installeur MSI trouvé à : $MSI_PATH"
            cp "$MSI_PATH" .
          fi

